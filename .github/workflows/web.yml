name: Publish web app
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: bash scripts/install-godot.sh web
      - name: Check audio timing
        run: npm test
      - name: Export web app
        run: bash scripts/build-web.sh
      - name: Capture README screenshots
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          XDG_DATA_HOME="$RUNNER_TEMP/klavo-screenshots" \
            timeout 45s xvfb-run -a godot --display-driver x11 --audio-driver Dummy --script scripts/capture-screenshots.gd
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
