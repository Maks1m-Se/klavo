name: Build Android test APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - name: Install Godot
        run: bash scripts/install-godot.sh android
      - name: Export Android APK
        run: bash scripts/build-android.sh
      - name: Verify the APK signature and permissions
        run: |
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs build/Piano-Metronome.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging build/Piano-Metronome.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump xmltree build/Piano-Metronome.apk AndroidManifest.xml | grep 'com.maksim.pianometronome.audio.MetronomeService'
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="test-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" build/Piano-Metronome.apk --target "$GITHUB_SHA" --prerelease --title "Android test build ${GITHUB_RUN_NUMBER}" --notes "ARM64 APK for testing on Android 8 and newer. This APK uses a debug signature."
