[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/piano/note-map.json"
exclude_filter="android-plugin/*,android/*,tests/*,dist/*,build/*"
export_path="dist/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
html/head_include="<script src='./audio-bridge.js'></script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false

[preset.1]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="assets/piano/note-map.json"
exclude_filter="android-plugin/*,android/*,tests/*,dist/*,build/*"
export_path="build/Piano-Metronome.apk"

[preset.1.options]
gradle_build/use_gradle_build=true
gradle_build/min_sdk="26"
gradle_build/target_sdk="35"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.maksim.pianometronome"
package/name="Piano & Metronome"
package/signed=true
